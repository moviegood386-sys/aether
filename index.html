<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Private AI on your device</title>
<style>
  :root{
    --bg:#07080c; --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.09);
    --text:#eceef4; --muted:#8b90a0; --a:#7c8cff; --b:#b27cff; --c:#4fe3c1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px 400px at 15% 10%,rgba(124,140,255,.22),transparent 60%),
      radial-gradient(700px 500px at 90% 90%,rgba(178,124,255,.18),transparent 60%),
      radial-gradient(500px 300px at 60% 0%,rgba(79,227,193,.08),transparent 60%)}
  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:920px;margin:0 auto;padding:20px 20px 16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 210deg,var(--a),var(--b),var(--c),var(--a));
    box-shadow:0 0 28px rgba(124,140,255,.45);position:relative}
  .logo::after{content:"";position:absolute;inset:7px;border-radius:7px;background:var(--bg)}
  .brand h1{font-size:17px;font-weight:600;letter-spacing:.2px}
  .brand p{font-size:12px;color:var(--muted);margin-top:1px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);backdrop-filter:blur(10px)}
  .dot{width:7px;height:7px;border-radius:50%;background:#555}
  .dot.on{background:var(--c);box-shadow:0 0 10px var(--c)}
  .dot.bad{background:#ff6b7a;box-shadow:0 0 10px #ff6b7a}

  main{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(18px);overflow:hidden}
  #chat{flex:1;overflow-y:auto;padding:26px 24px;scroll-behavior:smooth}
  #chat::-webkit-scrollbar{width:8px} #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}

  .hero{max-width:560px;margin:6vh auto 0;text-align:center}
  .hero h2{font-size:clamp(28px,5vw,40px);font-weight:650;line-height:1.1;letter-spacing:-.8px;
    background:linear-gradient(120deg,#fff 20%,var(--a) 60%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin:14px auto 26px;line-height:1.6;font-size:15px;max-width:460px}
  .picker{display:grid;gap:10px;text-align:left;margin-bottom:18px}
  .model{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
  .model:hover{border-color:rgba(124,140,255,.5)}
  .model.sel{border-color:var(--a);background:rgba(124,140,255,.09);box-shadow:0 0 0 3px rgba(124,140,255,.12)}
  .model b{font-size:14px;font-weight:600} .model span{font-size:12px;color:var(--muted)}
  .model em{font-style:normal;font-size:11px;color:var(--c);border:1px solid rgba(79,227,193,.35);padding:3px 8px;border-radius:99px;white-space:nowrap}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:15px;color:#fff;padding:14px 26px;border-radius:14px;
    background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 40px -8px rgba(124,140,255,.7);transition:.2s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}

  .loader{max-width:460px;margin:12vh auto 0;text-align:center}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:22px 0 12px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));transition:width .3s;border-radius:6px}
  .loader small{color:var(--muted);font-size:12px;display:block;min-height:32px;line-height:1.4}

  .msg{display:flex;gap:12px;margin-bottom:22px;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .av{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700}
  .msg.user .av{background:rgba(255,255,255,.1)}
  .msg.ai .av{background:linear-gradient(135deg,var(--a),var(--b))}
  .body{padding-top:4px;line-height:1.65;font-size:15px;min-width:0;overflow-wrap:anywhere}
  .body pre{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:10px 0;font-size:13px}
  .body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
  .body :not(pre)>code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
  .cursor::after{content:"";display:inline-block;width:8px;height:16px;background:var(--a);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite;border-radius:2px}
  @keyframes blink{to{opacity:0}}

  form{display:flex;gap:10px;align-items:flex-end;padding:14px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
  textarea{flex:1;resize:none;max-height:160px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--text);font:inherit;font-size:15px;outline:none;transition:.2s}
  textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(124,140,255,.15)}
  .send{width:46px;height:46px;border-radius:14px;padding:0;display:grid;place-items:center;font-size:18px}
  .hide{display:none!important}
  footer{text-align:center;font-size:11.5px;color:var(--muted);padding-top:12px}
</style>
</head>
<body>
<div class="glow"></div>
<div class="app">
  <header>
    <div class="brand"><div class="logo"></div><div><h1>Aether</h1><p>Private AI · runs on your device</p></div></div>
    <div class="pills">
      <div class="pill"><span class="dot" id="netDot"></span><span id="netTxt">Checking…</span></div>
      <div class="pill"><span class="dot" id="gpuDot"></span><span id="gpuTxt">WebGPU</span></div>
    </div>
  </header>

  <main>
    <div id="chat">
      <section class="hero" id="hero">
        <h2>Your own AI.<br>No cloud. No account.</h2>
        <p>Pick a model and it downloads once over your Wi-Fi, then runs entirely on your own hardware. Your chats never leave this device.</p>
        <div class="picker" id="picker"></div>
        <button class="btn" id="start">Start AI</button>
        <p class="note" id="warn"></p>
      </section>
    </div>
    <form id="form" class="hide">
      <textarea id="input" rows="1" placeholder="Message Aether…" autocomplete="off"></textarea>
      <button class="btn send" id="send" type="submit" title="Send">↑</button>
    </form>
  </main>
  <footer>Powered by WebLLM + WebGPU · Works offline after the first download</footer>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const MODELS = [
  {id:"Llama-3.2-1B-Instruct-q4f16_1-MLC", name:"Llama 3.2 · 1B", desc:"Fast and light. Great on phones & older laptops.", size:"~0.7 GB", tag:"Fastest"},
  {id:"Qwen2.5-1.5B-Instruct-q4f16_1-MLC", name:"Qwen 2.5 · 1.5B", desc:"Balanced speed and quality.", size:"~1 GB", tag:"Balanced"},
  {id:"Phi-3.5-mini-instruct-q4f16_1-MLC", name:"Phi 3.5 mini · 3.8B", desc:"Smartest option. Wants a decent GPU.", size:"~2.4 GB", tag:"Smartest"},
];
const $ = s => document.querySelector(s);
const chat=$("#chat"), form=$("#form"), input=$("#input"), send=$("#send");
let selected = MODELS[0].id, engine=null, busy=false;
const history=[{role:"system",content:"You are Aether, a helpful, concise and friendly AI assistant running privately on the user's own device."}];

// Network + GPU status
function net(){
  const on=navigator.onLine, c=navigator.connection;
  $("#netDot").className="dot "+(on?"on":"bad");
  $("#netTxt").textContent = on ? ("Online"+(c&&c.effectiveType?" · "+c.effectiveType.toUpperCase():"")) : "Offline";
}
addEventListener("online",net); addEventListener("offline",net); net();
const hasGPU = !!navigator.gpu;
$("#gpuDot").className="dot "+(hasGPU?"on":"bad");
$("#gpuTxt").textContent = hasGPU?"WebGPU ready":"No WebGPU";
if(!hasGPU){
  $("#warn").textContent="Your browser doesn't support WebGPU. Use a recent Chrome, Edge, or Safari 18+ on a device with a GPU.";
  $("#start").disabled=true;
}

// Model picker
const picker=$("#picker");
MODELS.forEach(m=>{
  const el=document.createElement("div");
  el.className="model"+(m.id===selected?" sel":"");
  el.innerHTML=`<div><b>${m.name}</b><br><span>${m.desc} · ${m.size}</span></div><em>${m.tag}</em>`;
  el.onclick=()=>{selected=m.id;[...picker.children].forEach(c=>c.classList.remove("sel"));el.classList.add("sel")};
  picker.appendChild(el);
});

// Load model
$("#start").onclick=async()=>{
  chat.innerHTML=`<div class="loader"><h2 style="font-size:24px;font-weight:600">Setting up your AI</h2>
    <div class="bar"><i id="fill"></i></div><small id="ptxt">Starting…</small>
    <p class="note">First run downloads the model through your Wi-Fi. After that it's cached on this device.</p></div>`;
  try{
    engine=await webllm.CreateMLCEngine(selected,{initProgressCallback:r=>{
      $("#fill").style.width=Math.round((r.progress||0)*100)+"%";
      $("#ptxt").textContent=r.text||"";
    }});
    chat.innerHTML="";
    form.classList.remove("hide");
    addMsg("ai","Hi, I'm Aether. I'm running fully on your device. What shall we work on?");
    input.focus();
  }catch(e){
    chat.innerHTML=`<div class="loader"><h2 style="font-size:22px">Couldn't start the AI</h2>
      <p class="note" style="font-size:13px">${esc(String(e.message||e))}</p>
      <p class="note">Try the smaller model, make sure WebGPU is enabled, or serve this file from <code>http://localhost</code> (run <code>python3 -m http.server</code> in this folder).</p>
      <br><button class="btn" onclick="location.reload()">Try again</button></div>`;
  }
};

// Chat helpers
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(t){
  let h=esc(t);
  h=h.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>`<pre><code>${c}</code></pre>`);
  h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  return h.replace(/\n(?![^<]*<\/code>)/g,"<br>");
}
function addMsg(role,text){
  const d=document.createElement("div");d.className="msg "+role;
  d.innerHTML=`<div class="av">${role==="ai"?"A":"You".slice(0,1)}</div><div class="body">${fmt(text)}</div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d.querySelector(".body");
}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});

form.onsubmit=async e=>{
  e.preventDefault();
  if(busy){engine.interruptGenerate();return}
  const text=input.value.trim(); if(!text||!engine) return;
  input.value="";input.style.height="auto";
  addMsg("user",text);history.push({role:"user",content:text});
  const body=addMsg("ai","");body.classList.add("cursor");
  busy=true;send.textContent="■";
  let out="";
  try{
    const stream=await engine.chat.completions.create({messages:history,stream:true,temperature:.7});
    for await(const ch of stream){
      out+=ch.choices[0]?.delta?.content||"";
      body.innerHTML=fmt(out);chat.scrollTop=chat.scrollHeight;
    }
  }catch(err){out+="\n\n(Error: "+(err.message||err)+")";body.innerHTML=fmt(out)}
  body.classList.remove("cursor");
  history.push({role:"assistant",content:out});
  busy=false;send.textContent="↑";input.focus();
};
</script>
</body>
</html>
